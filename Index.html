    .nav-btn {

      margin-top: 1.15rem; background: var(--ok-soft); border: 1px solid #c6e9d4;

    .modal-body { padding: 1rem 1.2rem 1.4rem; }
    
    .pay-summary {

    .pay-method:hover { border-color: #ccc; }

    .pay-method.active .icon { background: #ffe8d9; }

    .pay-method .info span { font-size: 12px; color: var(--muted); }

      flex-shrink: 0;
    }
    .pay-method.active .radio {

    .pay-panel { display: none; margin-top: .5rem; }

    .field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }

      transition: border-color .15s;

    .field input:focus, .field select:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(255 85 0 / .12);
    }
    .field-row { display: flex; gap: .65rem; }
    .field-row .field { flex: 1; }
    
    .transfer-box {
      background: var(--bg); border-radius: 12px; padding: 1rem;
      border: 1px solid var(--border); font-size: 13.5px;
    }
    .transfer-box .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: .4rem 0; border-bottom: 1px solid var(--border);
    }
    .transfer-box .row:last-child { border-bottom: none; }
    .transfer-box .key { color: var(--muted); }
    .transfer-box .val { font-weight: 600; font-family: monospace; letter-spacing: .02em; }
    .copy-btn {
      font-size: 11px; background: #fff; border: 1px solid var(--border);
      padding: 3px 8px; border-radius: 6px; margin-left: .4rem; color: var(--primary);
    }
    
    .pay-actions { margin-top: 1.15rem; display: flex; flex-direction: column; gap: .55rem; }
    .btn-pay {
      height: 52px; border-radius: 12px; font-size: 1.05rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      width: 100%; transition: transform .12s, opacity .15s;
    }
    .btn-pay.primary { background: var(--primary); color: #fff; }
    .btn-pay.primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-pay.wa { background: var(--wa); color: #fff; }
    .btn-pay:active:not(:disabled) { transform: scale(.98); }
    .btn-pay .spinner {
      width: 20px; height: 20px; border: 2.5px solid rgb(255 255 255 / .3);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
      display: none;
    }
    .btn-pay.loading .spinner { display: block; }
    .btn-pay.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .pay-success {
      text-align: center; padding: 1.5rem 1rem 1rem;
      display: none;
    }
    .pay-success.visible { display: block; }
    .pay-success .check {
      width: 68px; height: 68px; border-radius: 50%;
      background: var(--ok-soft); color: var(--ok);
      display: grid; place-items: center; font-size: 2rem; margin: 0 auto 1rem;
    }
    .pay-success h3 { font-size: 1.25rem; margin-bottom: .4rem; }
    .pay-success p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 1.2rem; }
    
    .secure-note {
      display: flex; align-items: center; justify-content: center; gap: .35rem;
      font-size: 11.5px; color: var(--subtle); margin-top: .75rem;
    }
    
    footer { text-align: center; padding: 1rem; font-size: 12px; color: var(--subtle); }
