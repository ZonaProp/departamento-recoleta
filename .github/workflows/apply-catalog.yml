name: Apply uploaded catalog

on:
  push:
    branches: [main]
    paths:
      - 'deploy/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild package
        run: |
          cat deploy/chunk_*.b64 > deploy/package.b64
          base64 -d deploy/package.b64 > deploy/package.tar.gz
          tar -xzf deploy/package.tar.gz -C .
          rm -rf deploy
          rm -f .github/workflows/apply-catalog.yml
      - name: Commit catalog
        run: |
          git config user.name "ZonaProp Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publicar catálogo completo de 498 departamentos" || exit 0
          git push
