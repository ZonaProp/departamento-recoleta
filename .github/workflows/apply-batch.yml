name: Apply catalog batch

on:
  push:
    branches: [main]
    paths:
      - 'batch_deploy/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract batch
        run: |
          base64 -d batch_deploy/batch.b64 > batch_deploy/batch.tar.xz
          tar -xJf batch_deploy/batch.tar.xz -C .
          rm -rf batch_deploy
          rm -f .github/workflows/apply-batch.yml
      - name: Commit batch
        run: |
          git config user.name "ZonaProp Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar departamentos 01 al 10" || exit 0
          git push
