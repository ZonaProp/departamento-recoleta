var listEl = document.getElementById("cardList");
var countEl = document.getElementById("count");
var current = "todos";
function render() {
  listEl.innerHTML = "";
  var n = 0;
  listings.forEach(function(item) {
    if (current !== "todos" && item.barrio !== current) return;
    n++;
    var a = document.createElement("a");
    a.className = "dept-card" + (item.featured ? " featured" : "");
    a.href = item.link;
    a.innerHTML = '<div class="dept-photo" style="background-image:url(\'' + item.img + '\')">' +
      (item.badge ? '<span class="badge">' + item.badge + '</span>' : '') + '</div>' +
      '<div class="dept-body"><div class="dept-barrio">' + item.barrio + '</div>' +
      '<div class="dept-title">' + item.title + '</div>' +
      '<div class="dept-specs">' + item.specs + '</div>' +
      '<div class="dept-price">' + item.price + ' <span>' + item.exp + '</span></div></div>';
    listEl.appendChild(a);
  });
  countEl.textContent = n + " departamentos";
}
document.querySelectorAll(".filter-chip").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".filter-chip").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    current = btn.getAttribute("data-barrio");
    render();
  });
});
render();
</script>
