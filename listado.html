:root{--primary:#ff5500;--bg:#f5f5f5;--muted:#5a5a5a;--border:#e8e8e8;--font:"Hind",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:#111;padding-bottom:2rem}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:30;height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center}
.hi{width:min(720px,100%);margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:1.25rem}.logo span{color:var(--primary)}
.back{font-size:13px;font-weight:600;color:var(--primary);padding:6px 12px;border-radius:999px;border:1.5px solid var(--primary)}
.wrap{width:min(720px,100%);margin:0 auto;padding:1rem}
h1{font-size:1.35rem;font-weight:700;margin-bottom:.35rem}
.subtitle{font-size:13.5px;color:var(--muted);margin-bottom:1rem}
.filters{display:flex;gap:.45rem;overflow-x:auto;padding-bottom:.75rem}
.filter-chip{flex-shrink:0;padding:.4rem .85rem;border-radius:999px;background:#fff;border:1.5px solid var(--border);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.count{font-size:13px;color:var(--muted);margin:.5rem 0}
.card-list{display:flex;flex-direction:column;gap:.85rem}
.dept-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--border);display:grid;grid-template-columns:120px 1fr;min-height:118px}
.dept-card.featured{border:2px solid var(--primary)}
.dept-photo{background:#ddd center/cover no-repeat;min-height:118px;position:relative}
.dept-photo .badge{position:absolute;top:8px;left:8px;background:rgb(0 0 0/.65);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px}
.dept-body{padding:.7rem .85rem;display:flex;flex-direction:column;justify-content:center;gap:.15rem}
.dept-barrio{font-size:12px;color:var(--muted)}
.dept-title{font-size:14px;font-weight:700}
.dept-specs{font-size:12.5px;color:var(--muted)}
.dept-price{font-size:15.5px;font-weight:800}
.dept-price span{font-size:12px;font-weight:500;color:var(--muted)}
.source{margin-top:1.25rem;padding:.85rem 1rem;background:#fff8f5;border:1px solid #ffd9c2;border-radius:12px;font-size:12.5px;color:var(--muted)}
</style>
</head>

var countEl = document.getElementById("count");
var current = "todos";
function render() {
  listEl.innerHTML = "";
  var n = 0;
  listings.forEach(function(item) {
    if (current !== "todos" && item.barrio !== current) return;
    n++;
    var a = document.createElement("a");
    a.className = "dept-card" + (item.featured ? " featured" : "");
    a.href = item.link;
    a.innerHTML = '<div class="dept-photo" style="background-image:url(\'' + item.img + '\')">' +
      (item.badge ? '<span class="badge">' + item.badge + '</span>' : '') + '</div>' +
      '<div class="dept-body"><div class="dept-barrio">' + item.barrio + '</div>' +
      '<div class="dept-title">' + item.title + '</div>' +
      '<div class="dept-specs">' + item.specs + '</div>' +
      '<div class="dept-price">' + item.price + ' <span>' + item.exp + '</span></div></div>';
    listEl.appendChild(a);
  });
  countEl.textContent = n + " departamentos";
}
document.querySelectorAll(".filter-chip").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".filter-chip").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    current = btn.getAttribute("data-barrio");
    render();
  });
});
